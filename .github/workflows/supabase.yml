# Keeps Supabase in step with this repo: on every push to main that touches supabase/,
# apply new database migrations and deploy the notify-checkin function.
# Needs repo secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD.
# Optional secrets (copied into the function's settings): VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, WEBHOOK_SECRET.
name: Supabase

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: uzawqjiczhbfxhylogir
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are set
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Add these in GitHub → Settings → Secrets and variables → Actions:$missing"
            exit 1
          fi
          # strip stray spaces/new lines from pasting, and pass the clean values on
          tok=$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '[:space:]')
          pw=$(printf '%s' "$SUPABASE_DB_PASSWORD" | tr -d '\r\n')
          echo "::add-mask::$tok"; echo "::add-mask::$pw"
          echo "SUPABASE_ACCESS_TOKEN=$tok" >> "$GITHUB_ENV"
          echo "SUPABASE_DB_PASSWORD=$pw" >> "$GITHUB_ENV"
          # show only the shape of the token, never the token
          case "$tok" in
            sbp_*) echo "Access token looks right (starts with sbp_, ${#tok} characters)." ;;
            *) echo "::error::SUPABASE_ACCESS_TOKEN doesn't start with sbp_ (it is ${#tok} characters). It must be the token from supabase.com/dashboard/account/tokens, not the database password."; exit 1 ;;
          esac

      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0   # pinned: newer CLIs have changed flags before

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Show migrations (local vs live)
        run: supabase migration list --remote --password "$SUPABASE_DB_PASSWORD"

      - name: Apply new migrations
        run: supabase db push --remote --include-all --yes --password "$SUPABASE_DB_PASSWORD"

      - name: Copy notification secrets into Supabase (if set)
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          args=""
          for k in VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY WEBHOOK_SECRET; do
            v="${!k}"; [ -n "$v" ] && args="$args $k=$v"
          done
          if [ -n "$args" ]; then supabase secrets set --yes $args; else echo "No notification secrets yet, skipping."; fi

      - name: Deploy Edge Functions (notify-checkin, cleanup-photos, notify-chat)
        run: |
          supabase functions deploy notify-checkin --no-verify-jwt --use-api --yes
          supabase functions deploy cleanup-photos --no-verify-jwt --use-api --yes
          supabase functions deploy notify-chat --no-verify-jwt --use-api --yes
